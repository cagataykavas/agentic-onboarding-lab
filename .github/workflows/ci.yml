name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      ONBOARDING_DATABASE_PATH: /tmp/onboarding_ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check onboarding.py service tests
      - run: pytest -q
      - run: python onboarding.py

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agentic-onboarding-platform:ci .
